name: Android staging build
on:
  push:
    branches: [main, master]
    paths: ['lib/**', 'android/**', 'pubspec.*', '.github/workflows/android.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.47.6'
          channel: stable
          cache: true
      - name: Write client configuration
        env:
          CLIENT_CONFIG: ${{ secrets.STAGING_CLIENT_CONFIG }}
          FIREBASE_CONFIG: ${{ secrets.FIREBASE_ANDROID_CONFIG }}
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          config = json.loads(os.environ['CLIENT_CONFIG'])
          if any(any(x in k.upper() for x in ['SECRET', 'SERVICE_ROLE', 'PASSWORD', 'PRIVATE_KEY']) for k in config):
              raise SystemExit('Only public client parameters may be used for app builds')
          firebase = json.loads(os.environ['FIREBASE_CONFIG'])
          if firebase['project_info']['project_id'] != 'petfriendly-staging':
              raise SystemExit('Wrong Firebase project')
          Path('config/app.android.staging.local.json').write_text(json.dumps(config))
          Path('android/app/google-services.json').write_text(json.dumps(firebase))
          PY
      - run: flutter pub get
      - run: flutter build apk --debug --dart-define-from-file=config/app.android.staging.local.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: petfriendly-android-staging-debug
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 1
          if-no-files-found: error
      - name: Remove temporary client configuration
        if: always()
        run: rm -f config/app.android.staging.local.json android/app/google-services.json
