name: petfriendly
description: PetFriendly Studio mobile prototype.
publish_to: none
version: 0.1.0+1
environment:
  sdk: '>=3.8.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.0.0
  go_router: ^17.0.0
  shared_preferences: ^2.5.3
  geolocator: ^14.0.2
  geocoding: ^4.0.0
  supabase_flutter: ^2.18.0
  flutter_secure_storage: ^11.2.0
  mapbox_maps_flutter: ^3.0.0
  flutter_local_notifications: ^22.3.1
  firebase_core: ^4.15.0
  firebase_messaging: ^16.7.0
  uuid: ^4.6.0
  image_picker: ^1.2.4
  http: ^1.6.0
  timezone: 0.11.1
  video_player: ^2.14.1
  path_provider: ^2.1.6
  firebase_crashlytics: ^5.4.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
flutter:
  config:
    enable-swift-package-manager: false
  uses-material-design: true
  assets:
    - assets/data/minsk_places.json
  fonts:
    - family: Manrope
      fonts:
        - asset: assets/fonts/Manrope.ttf
    - family: Golos Text
      fonts:
        - asset: assets/fonts/GolosText.ttf
