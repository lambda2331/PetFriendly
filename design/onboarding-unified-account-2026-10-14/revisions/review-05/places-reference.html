<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Places · fixed controls, scrolling results</title><link rel="stylesheet" href="../../frozen/design/shell-settings-studio-review/styles.css"><style>html,body{height:100%;margin:0;overflow:hidden;background:transparent}.places-page{--bg:#f8f9f4;--fg:#20261d;--muted:#636b5b;--line:#dce1d3;--soft:#eef1e6;--lime:#d7ef89;--onlime:#263510;height:100%;display:flex;flex-direction:column;background:var(--bg);color:var(--fg);position:relative}.status{padding:16px 20px 8px;flex:none}.places-header{display:flex;align-items:center;gap:8px;min-height:64px;padding:8px 12px 12px;flex:none}.places-header h2{font:600 18px Golos;flex:1;text-align:center}.places-controls{padding:0 20px;flex:none}.places-controls .search{margin-bottom:12px}.category-tools{display:flex;align-items:end;gap:12px}.category-field{flex:1;min-width:0;font-size:12px;color:var(--muted)}.category-field select{width:100%;height:48px;border:1px solid var(--line);border-radius:12px;background:var(--soft);padding:10px 12px;color:var(--fg);font:16px Golos}.filter-button{display:flex;align-items:center;justify-content:center;gap:8px;font-size:14px;white-space:nowrap;border:1px solid var(--line);padding:10px 14px}.results-count{font-size:12px;color:var(--muted);margin:16px 0 12px}.places-results{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;padding:0 20px 20px;scrollbar-width:thin;scrollbar-color:var(--line) var(--bg)}.place-row{display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--line);padding:16px 0;border-radius:0;width:100%;text-align:left}.place-row .avatar{width:48px;height:48px}.place-row .copy{flex:1;min-width:0}.place-row strong{font:600 18px Golos;display:block}.place-row .meta{font-size:12px}.place-row .access{display:flex;align-items:center;gap:6px}.place-row .access .icon{height:14px;width:14px}.rating{display:flex;align-items:center;gap:4px;font:16px Golos;white-space:nowrap}.rating .icon{width:14px;height:14px;fill:currentColor}.place-row>.icon{width:16px}.attribution{font:12px/1.5 Golos;margin:20px 0;color:var(--muted)}.places-page .sheet{max-height:88%}.places-page .sheet-body{padding-bottom:20px}.places-page .sheet-head{padding-top:12px}.places-page .field input{font-size:16px}.empty{padding:36px 0;font-size:14px;color:var(--muted)}.map-pin-action{width:48px}.avatar.park{background:var(--lime);color:var(--onlime)}.places-page.dark{--bg:#131711;--fg:#f2f4ed;--muted:#b9c1b1;--line:#3e4638;--soft:#262e21;--lime:#d3eb82;--onlime:#263510}@media(max-width:340px){.category-tools{gap:8px}.filter-button{padding:10px;font-size:12px}.places-header h2{font-size:16px}.place-row{gap:8px}.place-row strong{font-size:16px}.rating{font-size:14px}}</style><section class="places-page" id="places"><div class="status"><strong>9:41</strong><span>LTE</span></div><header class="places-header"><button class="icon-button" aria-label="Назад к карте" onclick="parent.dismiss()"><i data-lucide="arrow-left" class="icon"></i></button><h2>Места · Минск</h2><button class="icon-button map-pin-action" aria-label="Добавить место" onclick="addPlace()"><i data-lucide="map-pin-plus" class="icon"></i></button></header><div class="places-controls" id="controls"><label class="search"><i data-lucide="search" class="icon"></i><input aria-label="Название или категория" placeholder="Название или категория" oninput="query=this.value;renderResults()"></label><div class="category-tools"><label class="category-field">Категория<select aria-label="Категория" onchange="category=this.value;renderResults()"><option value="all">Все места</option><option value="park">Парки</option><option value="dog">Площадки</option></select></label><button class="filter-button" onclick="filters()"><i data-lucide="sliders-horizontal" class="icon"></i>Фильтры мест</button></div><p class="results-count" id="count"></p></div><div class="places-results" id="results" tabindex="0" role="region" aria-label="Список мест"></div><div id="overlay"></div></section><script src="../../frozen/design/walking-assets/lucide.min.js"></script><script>
const fixtures=[{name:'Зелёный парк',distance:'600 м',kind:'Парк',category:'park',rating:'4,8',icon:'trees'},{name:'Площадка у дома',distance:'1,2 км',kind:'Площадка',category:'dog',rating:'4,6',icon:'paw-print'}];
let query='',category='all',onlyFavorites=false;
function renderResults(){const found=fixtures.filter(p=>(category==='all'||p.category===category)&&(p.name+' '+p.kind).toLowerCase().includes(query.toLowerCase())&&!onlyFavorites);document.getElementById('count').textContent=found.length===1?'1 место':found.length===2?'2 места':'Нет мест';document.getElementById('results').innerHTML=found.map(p=>'<button class="place-row" onclick="placeDetails('+fixtures.indexOf(p)+')"><span class="avatar '+(p.category==='park'?'park':'')+'"><i data-lucide="'+p.icon+'" class="icon"></i></span><span class="copy"><strong>'+p.name+'</strong><span class="meta">'+p.distance+' · '+p.kind+'</span><span class="meta access"><i data-lucide="circle-help" class="icon"></i>Допуск не подтверждён</span></span><span class="rating">'+p.rating+'<i data-lucide="star" class="icon"></i></span><i data-lucide="chevron-right" class="icon"></i></button>').join('')+(found.length?'':'<p class="empty">Совпадений нет. Измените поиск или фильтры.</p>')+'<p class="attribution">© OpenStreetMap contributors · ODbL. Отметки допуска из OSM требуют уточнения перед визитом.</p>';lucide.createIcons();}
function closeSheet(){document.getElementById('overlay').innerHTML='';lock(false);}
function lock(on){document.querySelector('.status').inert=on;document.querySelector('.places-header').inert=on;document.getElementById('controls').inert=on;document.getElementById('results').inert=on;}
function sheet(title,content){document.getElementById('overlay').innerHTML='<div class="shade"><section class="sheet" role="dialog" aria-modal="true" aria-label="'+title+'"><header class="sheet-head"><h2>'+title+'</h2><button class="icon-button" aria-label="Закрыть" onclick="closeSheet()"><i data-lucide="x" class="icon"></i></button></header><div class="sheet-body">'+content+'</div></section></div>';lock(true);lucide.createIcons();document.querySelector('#overlay button').focus();}
function filters(){sheet('Фильтры мест','<button class="choice" aria-pressed="'+onlyFavorites+'" onclick="onlyFavorites=!onlyFavorites;renderResults();filters()">Только избранные</button><button class="primary" onclick="closeSheet()">Показать места</button>');}
function placeDetails(n){const p=fixtures[n];sheet(p.name,'<p class="meta">Минск · '+p.kind+'</p><p>Доступ с питомцем пока не подтверждён.</p><button class="outline" onclick="closeSheet()">Готово</button>');}
function addPlace(){sheet('Добавить место','<p>Выберите публичное место на карте. Для публикации потребуется проверка.</p><button class="outline" onclick="closeSheet()">Вернуться к списку</button>');}
document.addEventListener('keydown',e=>{const overlay=document.getElementById('overlay');if(!overlay.children.length)return;if(e.key==='Escape')closeSheet();if(e.key==='Tab'){const nodes=[...overlay.querySelectorAll('button,input,select')];if(e.shiftKey&&document.activeElement===nodes[0]){e.preventDefault();nodes.at(-1).focus()}else if(!e.shiftKey&&document.activeElement===nodes.at(-1)){e.preventDefault();nodes[0].focus()}}});
if(parent.parent.getThemePreview?.())document.getElementById('places').classList.add('dark');
renderResults();
</script></html>
