<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Places · fixed controls, scrolling results</title><link rel="stylesheet" href="../../frozen/design/shell-settings-studio-review/styles.css"><style>html,body{height:100%;margin:0;overflow:hidden;background:transparent}.places-page{--bg:#f8f9f4;--fg:#20261d;--muted:#636b5b;--line:#dce1d3;--soft:#eef1e6;--lime:#d7ef89;--onlime:#263510;height:100%;display:flex;flex-direction:column;background:var(--bg);color:var(--fg);position:relative}.status{padding:16px 20px 8px;flex:none}.places-header{display:flex;align-items:center;gap:8px;min-height:64px;padding:8px 12px 12px;flex:none}.places-header h2{font:600 18px Golos;flex:1;text-align:center}.places-controls{padding:0 20px;flex:none}.places-controls .search{margin-bottom:12px}.category-tools{display:flex;align-items:end;gap:12px}.category-field{flex:1;min-width:0;font-size:12px;color:var(--muted)}.category-field select{width:100%;height:48px;border:1px solid var(--line);border-radius:12px;background:var(--soft);padding:10px 12px;color:var(--fg);font:16px Golos}.filter-button{display:flex;align-items:center;justify-content:center;gap:8px;font-size:14px;white-space:nowrap;border:1px solid var(--line);padding:10px 14px}.results-count{font-size:12px;color:var(--muted);margin:16px 0 12px}.places-results{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;padding:0 20px 20px;scrollbar-width:thin;scrollbar-color:var(--line) var(--bg)}.place-row{display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--line);padding:16px 0;border-radius:0;width:100%;text-align:left}.place-row .avatar{width:48px;height:48px}.place-row .copy{flex:1;min-width:0}.place-row strong{font:600 18px Golos;display:block}.place-row .meta{font-size:12px}.place-row .access{display:flex;align-items:center;gap:6px}.place-row .access .icon{height:14px;width:14px}.rating{display:flex;align-items:center;gap:4px;font:16px Golos;white-space:nowrap}.rating .icon{width:14px;height:14px;fill:currentColor}.place-row>.icon{width:16px}.attribution{font:12px/1.5 Golos;margin:20px 0;color:var(--muted)}.places-page .sheet{max-height:88%}.places-page .sheet-body{padding-bottom:20px}.places-page .sheet-head{padding-top:12px}.places-page .field input{font-size:16px}.empty{padding:36px 0;font-size:14px;color:var(--muted)}.map-pin-action{width:48px}.avatar.park{background:var(--lime);color:var(--onlime)}.places-page.dark{--bg:#131711;--fg:#f2f4ed;--muted:#b9c1b1;--line:#3e4638;--soft:#262e21;--lime:#d3eb82;--onlime:#263510}@media(max-width:340px){.category-tools{gap:8px}.filter-button{padding:10px;font-size:12px}.places-header h2{font-size:16px}.place-row{gap:8px}.place-row strong{font-size:16px}.rating{font-size:14px}}.filter-button{border-radius:12px}.filter-button[aria-pressed=true]{background:var(--soft);border-color:var(--fg);font-weight:700}.filter-button[aria-pressed=true] .icon{fill:currentColor}.category-select{display:flex;gap:8px;align-items:center;width:100%;height:48px;border:1px solid var(--line);border-radius:12px;background:var(--soft);padding:12px;color:var(--fg);font:16px Golos}.category-select span{flex:1;text-align:left}.category-select .icon{width:20px;height:20px}.places-empty{padding:48px 12px;text-align:center}.places-empty>.icon{width:32px;height:32px;color:var(--muted)}.places-empty h3{font:700 18px Manrope;margin:16px 0 8px}.places-empty p{font:14px/1.5 Golos;color:var(--muted);margin:0 0 20px}.place-meta{display:flex;align-items:center;justify-content:space-between;gap:12px}.place-actions{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0}.place-reviews{border-top:1px solid var(--line);padding-top:16px;margin-top:20px}.place-reviews h3{font:700 18px Manrope}.choice{margin:4px 0}.places-page .sheet-head .icon-button{margin:0}.places-page .sheet-head{gap:12px}</style><section class="places-page" id="places"><div class="status"><strong>9:41</strong><span>LTE</span></div><header class="places-header"><button class="icon-button" aria-label="Назад к карте" onclick="parent.dismiss()"><i data-lucide="arrow-left" class="icon"></i></button><h2>Места · Минск</h2><button class="icon-button map-pin-action" aria-label="Добавить место" onclick="addPlace()"><i data-lucide="map-pin-plus" class="icon"></i></button></header><div class="places-controls" id="controls"><label class="search"><i data-lucide="search" class="icon"></i><input aria-label="Название или категория" placeholder="Название или категория" oninput="query=this.value;renderResults()"></label><div class="category-tools"><label class="category-field">Категория<button class="category-select" id="category-button" aria-label="Категория: Все места" aria-haspopup="dialog" aria-expanded="false" onclick="chooseCategory()"><span id="category-value">Все места</span><i data-lucide="chevron-down" class="icon"></i></button></label><button class="filter-button" id="favorites-toggle" aria-label="Только избранные" aria-pressed="false" onclick="toggleFavorites()"><i data-lucide="heart" class="icon"></i>Избранные</button></div><p class="results-count" id="count"></p></div><div class="places-results" id="results" tabindex="0" role="region" aria-label="Список мест"></div><div id="overlay"></div></section><script src="../../frozen/design/walking-assets/lucide.min.js"></script><script>
const fixtures=[{name:'Зелёный парк',distance:'600 м',kind:'Парк',category:'park',rating:'4,8',icon:'trees'},{name:'Площадка у дома',distance:'1,2 км',kind:'Площадка',category:'dog',rating:'4,6',icon:'paw-print'}];
let query='',category='all',onlyFavorites=false;const favoritePlaces=new Set(),reviewPreviews=new Map();let activePlace=0;
function renderResults(){const found=fixtures.filter(p=>(category==='all'||p.category===category)&&(p.name+' '+p.kind).toLowerCase().includes(query.toLowerCase())&&(!onlyFavorites||favoritePlaces.has(fixtures.indexOf(p))));document.getElementById('count').hidden=!found.length;document.getElementById('count').textContent=found.length===1?'1 место':found.length===2?'2 места':'';document.getElementById('results').innerHTML=found.map(p=>'<button class="place-row" onclick="placeDetails('+fixtures.indexOf(p)+')"><span class="avatar '+(p.category==='park'?'park':'')+'"><i data-lucide="'+p.icon+'" class="icon"></i></span><span class="copy"><strong>'+p.name+'</strong><span class="meta">'+p.distance+' · '+p.kind+'</span><span class="meta access"><i data-lucide="circle-help" class="icon"></i>Допуск не подтверждён</span></span><span class="rating">'+p.rating+'<i data-lucide="star" class="icon"></i></span><i data-lucide="chevron-right" class="icon"></i></button>').join('')+(found.length?'<p class="attribution">© OpenStreetMap contributors · ODbL. Отметки допуска из OSM требуют уточнения перед визитом.</p>':'<div class="places-empty"><i data-lucide="'+(onlyFavorites?'heart':'search')+'" class="icon"></i><h3>'+(onlyFavorites?'Пока нет избранных мест':'Ничего не найдено')+'</h3><p>'+(onlyFavorites?'Сохраняйте места сердцем в их карточке — они появятся здесь.':'Попробуйте другое название или измените категорию.')+'</p><button class="outline" onclick="resetFilters()">'+(onlyFavorites?'Посмотреть все места':'Сбросить поиск и фильтры')+'</button></div>');lucide.createIcons();}
function closeSheet(){document.getElementById('category-button').setAttribute('aria-expanded','false');document.getElementById('overlay').innerHTML='';lock(false);}
function lock(on){document.querySelector('.status').inert=on;document.querySelector('.places-header').inert=on;document.getElementById('controls').inert=on;document.getElementById('results').inert=on;}
function sheet(title,content){document.getElementById('overlay').innerHTML='<div class="shade"><section class="sheet" role="dialog" aria-modal="true" aria-label="'+title+'"><header class="sheet-head"><h2>'+title+'</h2><button class="icon-button" aria-label="Закрыть" onclick="closeSheet()"><i data-lucide="x" class="icon"></i></button></header><div class="sheet-body">'+content+'</div></section></div>';lock(true);lucide.createIcons();document.querySelector('#overlay button').focus();}
function toggleFavorites(){onlyFavorites=!onlyFavorites;document.getElementById('favorites-toggle').setAttribute('aria-pressed',String(onlyFavorites));renderResults();}

function placeDetails(n){activePlace=n;const p=fixtures[n];sheet(p.name,'<div class="place-meta"><span class="meta">'+p.kind+' · Минск</span><span class="rating"><i data-lucide="star" class="icon"></i>'+p.rating+'</span></div><p>Доступ с питомцем пока не подтверждён.</p><div class="place-actions"><button class="outline" onclick="parent.closeSheetForMap()"><i data-lucide="map" class="icon"></i>На карте</button><button class="outline" onclick="favoritePlace()" aria-pressed="'+favoritePlaces.has(n)+'"><i data-lucide="heart" class="icon"></i>'+(favoritePlaces.has(n)?'В избранном':'В избранное')+'</button></div><section class="place-reviews"><h3>Отзывы</h3><p class="plain-hint">'+(reviewPreviews.has(n)?'Ваш отзыв сохранён в макете.':'Отзывы не загрузились.')+'</p><button class="subtle-button" onclick="placeDetails(activePlace)">Повторить</button><button class="outline" onclick="reviewForm()">Оставить отзыв</button></section>');}
function favoritePlace(){if(favoritePlaces.has(activePlace))favoritePlaces.delete(activePlace);else favoritePlaces.add(activePlace);renderResults();placeDetails(activePlace);}
function reviewForm(){sheet('Отзыв о месте','<p class="meta">'+fixtures[activePlace].name+'</p><label class="field">Оценка<select aria-label="Оценка"><option>5</option><option>4</option><option>3</option><option>2</option><option>1</option></select></label><label class="field">Ваш отзыв<textarea id="review-body" rows="3"></textarea></label><button class="primary" onclick="sendReview()">Сохранить в макете</button>');}
function sendReview(){reviewPreviews.set(activePlace,{body:document.getElementById('review-body').value,stars:document.querySelector('[aria-label=Оценка]').value});sheet('Спасибо за отзыв','<p>Отзыв сохранён в макете.</p>');}
function chooseCategory(){sheet('Категория',Object.entries({all:'Все места',park:'Парки',dog:'Площадки'}).map(([key,label])=>'<button class="choice" role="radio" aria-checked="'+(category===key)+'" onclick="setCategory(&quot;'+key+'&quot;)"><span>'+label+'</span>'+(category===key?'<i data-lucide="check" class="icon"></i>':'')+'</button>').join(''));document.getElementById('category-button').setAttribute('aria-expanded','true');}
function setCategory(key){category=key;const label={all:'Все места',park:'Парки',dog:'Площадки'}[key];document.getElementById('category-value').textContent=label;document.getElementById('category-button').setAttribute('aria-label','Категория: '+label);renderResults();closeSheet();}
function resetFilters(){query='';onlyFavorites=false;document.querySelector('.search input').value='';document.getElementById('favorites-toggle').setAttribute('aria-pressed','false');setCategory('all');}

function addPlace(){sheet('Добавить место','<p>Выберите публичное место на карте. Для публикации потребуется проверка.</p><button class="outline" onclick="closeSheet()">Вернуться к списку</button>');}
document.addEventListener('keydown',e=>{const overlay=document.getElementById('overlay');if(!overlay.children.length)return;if(e.key==='Escape')closeSheet();if(e.key==='Tab'){const nodes=[...overlay.querySelectorAll('button,input,select')];if(e.shiftKey&&document.activeElement===nodes[0]){e.preventDefault();nodes.at(-1).focus()}else if(!e.shiftKey&&document.activeElement===nodes.at(-1)){e.preventDefault();nodes[0].focus()}}});
if(parent.parent.getThemePreview?.())document.getElementById('places').classList.add('dark');
renderResults();
</script></html>
