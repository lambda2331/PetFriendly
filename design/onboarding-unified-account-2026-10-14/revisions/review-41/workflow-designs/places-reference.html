</style><link rel="stylesheet" href="mock-system.css"><section class="places-page" id="places"><div class="status"><strong>9:41</strong><span>LTE</span></div><header class="places-header"><button class="icon-button" aria-label="Назад к карте" onclick="parent.dismiss()"><i data-lucide="arrow-left" class="icon"></i></button><h2>Места · Минск</h2><button class="icon-button map-pin-action" aria-label="Добавить место" onclick="addPlace()"><i data-lucide="map-pin-plus" class="icon"></i></button></header><div class="places-controls" id="controls"><label class="search"><i data-lucide="search" class="icon"></i><input aria-label="Название или категория" placeholder="Название или категория" oninput="query=this.value;renderResults()"></label><div class="category-tools"><label class="category-field">Категория<div class="category-anchor"><button class="category-select" id="category-button" aria-label="Категория: Все места" aria-haspopup="menu" aria-expanded="false" onclick="toggleCategoryMenu()"><span id="category-value">Все места</span><i data-lucide="chevron-down" class="icon"></i></button><div id="category-menu" class="filter-menu" role="menu" aria-label="Категория" hidden></div></div></label><button class="filter-button" id="favorites-toggle" aria-label="Только избранные" aria-pressed="false" onclick="toggleFavorites()"><i data-lucide="heart" class="icon"></i>Избранные</button></div><p class="results-count" id="count"></p><div id="proposal-status"></div></div><div class="places-results" id="results" tabindex="0" role="region" aria-label="Список мест"></div><div id="overlay"></div></section><script src="frozen/design/walking-assets/lucide.min.js"></script><script>
const fixtures=[{name:'Зелёный парк',distance:'600 м',kind:'Парк',category:'park',rating:'4,8',icon:'trees'},{name:'Площадка у дома',distance:'1,2 км',kind:'Площадка',category:'dog',rating:'4,6',icon:'paw-print'},{name:'Парк Победы',kind:'Парк',category:'park',rating:null,icon:'trees',profileOnly:true},{name:'Площадка у озера',kind:'Площадка для собак',category:'dog',rating:null,icon:'paw-print',profileOnly:true}];
let query='',category='all',onlyFavorites=false;const favoritePlaces=new Set(),reviewPreviews=new Map();let activePlace=0;const reviewLoadStates=new Map();let reviewAttempt=0;
function renderResults(){const found=fixtures.filter(p=>!p.profileOnly&&(category==='all'||p.category===category)&&(p.name+' '+p.kind).toLowerCase().includes(query.toLowerCase())&&(!onlyFavorites||favoritePlaces.has(fixtures.indexOf(p))));document.getElementById('count').hidden=!found.length;document.getElementById('count').textContent=found.length===1?'1 место':found.length===2?'2 места':'';document.getElementById('results').innerHTML=found.map(p=>'<button class="place-row" onclick="placeDetails('+fixtures.indexOf(p)+')"><span class="avatar '+(p.category==='park'?'park':'')+'"><i data-lucide="'+p.icon+'" class="icon"></i></span><span class="copy"><strong>'+p.name+'</strong><span class="meta">'+p.distance+' · '+p.kind+'</span><span class="meta access"><i data-lucide="circle-help" class="icon"></i>Допуск не подтверждён</span></span>'+(p.rating?'<span class="rating">'+p.rating+'<i data-lucide="star" class="icon"></i></span>':'')+'<i data-lucide="chevron-right" class="icon"></i></button>').join('')+(found.length?'<p class="attribution">© OpenStreetMap contributors · ODbL. Отметки допуска из OSM требуют уточнения перед визитом.</p>':'<div class="places-empty"><i data-lucide="'+(onlyFavorites?'heart':'search')+'" class="icon"></i><h3>'+(onlyFavorites?'Пока нет избранных мест':'Ничего не найдено')+'</h3><p>'+(onlyFavorites?'Сохраняйте места сердцем в их карточке — они появятся здесь.':'Попробуйте другое название или измените категорию.')+'</p><button class="outline" onclick="resetFilters()">'+(onlyFavorites?'Посмотреть все места':'Сбросить поиск и фильтры')+'</button></div>');lucide.createIcons();}
function closeSheet(){if(new URLSearchParams(location.search).has('detail')){parent.closeSheet(0);return;}document.getElementById('overlay').innerHTML='';lock(false);}
function lock(on){document.querySelector('.status').inert=on;document.querySelector('.places-header').inert=on;document.getElementById('controls').inert=on;document.getElementById('results').inert=on;}

function toggleFavorites(){onlyFavorites=!onlyFavorites;document.getElementById('favorites-toggle').setAttribute('aria-pressed',String(onlyFavorites));renderResults();}

function placeDetails(n){activePlace=n;const p=fixtures[n];sheet(p.name,'<div class="place-meta"><span class="meta">'+p.kind+' · Минск</span>'+(p.rating?'<span class="rating"><i data-lucide="star" class="icon"></i>'+p.rating+'</span>':'')+'</div><p>Доступ с питомцем пока не подтверждён.</p><div class="place-actions"><button class="outline map-action" onclick="parent.closeSheetForMap(fixtures[activePlace].name)"><i data-lucide="map" class="icon"></i>На карте</button><button class="outline" onclick="favoritePlace()" aria-pressed="'+favoritePlaces.has(n)+'"><i data-lucide="heart" class="icon"></i>'+(favoritePlaces.has(n)?'В избранном':'В избранное')+'</button></div><button type="button" class="review-text-action" onclick="location.href=&quot;workflow-additions.html?state=report-place&place='+encodeURIComponent(p.name)+'&quot;">Пожаловаться на место</button><section class="place-reviews"><div class="reviews-heading"><h3>Отзывы</h3><button class="review-text-action" onclick="reviewForm()">Написать</button></div><div id="review-status" role="status" aria-live="polite">'+reviewStatus(n)+'</div></section>');}
function reviewStatus(n){
 if(reviewPreviews.has(n)){const review=reviewPreviews.get(n);return '<article class="review-item"><div class="review-byline"><strong>Ваш отзыв</strong><span>'+review.stars+' / 5</span></div><p>'+safeText(review.body)+'</p><span class="review-caption">Локальный предпросмотр</span></article>';}
 if(reviewLoadStates.get(n)==='ready')return '<article class="review-item"><div class="review-byline"><strong>Анна</strong><span>5 ★</span></div><p>Приятное место для прогулки.</p><span class="review-caption">Пример отзыва · макет</span></article>';
 return '<div class="review-error"><span>Отзывы не загрузились</span><button class="review-text-action" onclick="retryReviews()" aria-label="Загрузить отзывы снова">Обновить</button></div>';
}
function retryReviews(){
 const n=activePlace,attempt=++reviewAttempt,status=document.getElementById('review-status');
 status.setAttribute('aria-busy','true');status.innerHTML='<div class="review-loading"><span class="loading-dot" aria-hidden="true"></span><span>Загружаем отзывы…</span></div>';
 // Design-only recovery fixture: no server request or rating aggregate mutation.
 setTimeout(()=>{reviewLoadStates.set(n,'ready');if(attempt!==reviewAttempt||activePlace!==n)return;const current=document.getElementById('review-status');if(!current)return;current.setAttribute('aria-busy','false');current.innerHTML=reviewStatus(n);},650);
}
function favoritePlace(){if(favoritePlaces.has(activePlace))favoritePlaces.delete(activePlace);else favoritePlaces.add(activePlace);renderResults();placeDetails(activePlace);}
let reviewRating=0;
function reviewForm(){reviewRating=Number(reviewPreviews.get(activePlace)?.stars||0);sheet('Отзыв о месте','<h3 class="review-place-name">'+safeText(fixtures[activePlace].name)+'</h3><fieldset class="place-star-field"><legend>Ваша оценка</legend><div class="place-star-choices" role="radiogroup" aria-label="Оценка">'+[1,2,3,4,5].map(n=>'<button type="button" role="radio" aria-checked="'+(reviewRating===n)+'" aria-label="'+n+' из 5" data-star="'+n+'" tabindex="'+((reviewRating||1)===n?0:-1)+'" onkeydown="placeRatingKey(event,'+n+')" class="place-star '+(n<=reviewRating?'selected':'')+'" onclick="selectPlaceRating('+n+')"><i data-lucide="star" class="icon"></i></button>').join('')+'</div><p id="rating-error" class="form-error" role="alert"></p></fieldset><label class="field">Ваш отзыв<textarea id="review-body" rows="3">'+safeText(reviewPreviews.get(activePlace)?.body||'')+'</textarea></label><button class="primary" onclick="sendReview()">Сохранить в макете</button>');}
function selectPlaceRating(n){reviewRating=n;document.querySelectorAll('[data-star]').forEach(b=>{b.setAttribute('aria-checked',String(Number(b.dataset.star)===n));b.classList.toggle('selected',Number(b.dataset.star)<=n);b.tabIndex=Number(b.dataset.star)===n?0:-1});document.getElementById('rating-error').textContent='';}
function placeRatingKey(event,n){const key=event.key;if(!['ArrowLeft','ArrowRight','ArrowUp','ArrowDown','Home','End'].includes(key))return;event.preventDefault();const next=key==='Home'?1:key==='End'?5:Math.max(1,Math.min(5,n+(['ArrowLeft','ArrowDown'].includes(key)?-1:1)));selectPlaceRating(next);document.querySelector('[data-star="'+next+'"]').focus();}
function sendReview(){if(!reviewRating){document.getElementById('rating-error').textContent='Выберите оценку от 1 до 5.';document.querySelector('[data-star]').focus();return;}reviewPreviews.set(activePlace,{body:document.getElementById('review-body').value,stars:reviewRating});placeDetails(activePlace);placeStatus('Отзыв сохранён в макете');}
function placeStatus(text){document.querySelector('.place-status-toast')?.remove();const notice=document.createElement('div');notice.className='place-status-toast';notice.setAttribute('role','status');notice.textContent=text;document.getElementById('places').append(notice);setTimeout(()=>notice.remove(),4500);}

function addPlace(){
 const markers=publicPoints.map((point,i)=>'<button class="public-point-marker '+(placeDraft.point===i?'selected':'')+'" style="left:'+(i===0?'28':'68')+'%;top:'+(i===0?'38':'65')+'%" aria-label="Выбрать точку: '+safeText(point.label)+'" aria-pressed="'+(placeDraft.point===i)+'" onclick="pickPublicPoint('+i+')"><i data-lucide="map-pin" class="icon"></i><span>'+safeText(point.label)+'</span></button>').join('');
 document.getElementById('overlay').innerHTML='<section class="public-point-page" role="dialog" aria-modal="true" aria-label="Новое место"><header class="places-header"><button class="icon-button" aria-label="Назад к списку мест" onclick="closeSheet()"><i data-lucide="arrow-left" class="icon"></i></button><h2>Новое место</h2></header><div class="public-point-map"><div class="point-map-caption"><strong>Выберите точку на карте</strong><p>Схема для макета · Минск</p></div>'+markers+'<p class="point-map-unavailable">Карта пока недоступна</p></div><footer class="point-map-footer"><p>'+(placeDraft.point===null?'Отметьте публичное место, а не домашний адрес.':safeText(publicPoints[placeDraft.point].label))+'</p><button class="primary" '+(placeDraft.point===null?'disabled':'')+' onclick="placeProposalForm()">Продолжить</button></footer></section>';lock(true);lucide.createIcons();document.querySelector('.public-point-page button').focus();
}
function pickPublicPoint(i){placeDraft.point=i;addPlace();}
function placeProposalForm(error=''){
 sheet('О новом месте','<button class="context-edit" onclick="addPlace()" aria-label="Изменить точку на карте"><span class="context-summary"><span class="context-avatar"><i data-lucide="map-pin" class="icon"></i></span><span><strong>'+safeText(publicPoints[placeDraft.point].label)+'</strong><span class="meta">Минск · Изменить точку</span></span></span><i data-lucide="chevron-right" class="icon"></i></button><label class="field">Название<input id="proposal-name" maxlength="100" value="'+safeText(placeDraft.name)+'" placeholder="Например, парк у озера" oninput="placeDraft.name=this.value"></label><label class="field">Категория<button class="category-select" onclick="proposalCategory()"><span>'+proposalKinds[placeDraft.category]+'</span><i data-lucide="chevron-down" class="icon"></i></button></label><label class="field">Комментарий · необязательно<textarea id="proposal-note" maxlength="500" rows="2" placeholder="Что стоит знать об этом месте?" oninput="placeDraft.note=this.value">'+safeText(placeDraft.note)+'</textarea></label><p class="plain-hint">Доступ с питомцем пока неизвестен.</p><p class="form-error" role="alert">'+error+'</p><button class="primary" onclick="checkProposal()">Опубликовать</button>');
}
function proposalCategory(){sheet('Категория',Object.entries(proposalKinds).map(([key,label])=>'<button class="choice" role="radio" aria-checked="'+(placeDraft.category===key)+'" onclick="setProposalCategory(&quot;'+key+'&quot;)"><span>'+label+'</span>'+(placeDraft.category===key?'<i data-lucide="check" class="icon"></i>':'')+'</button>').join(''));}
function setProposalCategory(key){placeDraft.category=key;placeProposalForm();}
function checkProposal(){placeDraft.name=placeDraft.name.trim();if(!placeDraft.name){placeProposalForm('Укажите название места.');document.getElementById('proposal-name').focus();return;}const duplicate=fixtures.findIndex(p=>p.name.toLowerCase()===placeDraft.name.toLowerCase());if(duplicate>=0){placeDetails(duplicate);return;}submitPlacePreview();}
function submitPlacePreview(){const draft={...placeDraft};fixtures.push({name:safeText(draft.name),category:draft.category,kind:proposalKinds[draft.category],icon:draft.category==='park'?'trees':draft.category==='dog'?'paw-print':'map-pin',distance:'Минск',rating:'',note:draft.note,publicPoint:publicPoints[draft.point]});placeDraft={point:null,name:'',category:'park',note:''};closeSheet();renderResults();document.getElementById('proposal-status').innerHTML='<p class="place-status-toast" role="status">Место опубликовано · в памяти макета</p>';}
document.addEventListener('keydown',e=>{const overlay=document.getElementById('overlay');if(!overlay.children.length)return;if(e.key==='Escape')closeSheet();if(e.key==='Tab'){const nodes=[...overlay.querySelectorAll('button,input,select')];if(e.shiftKey&&document.activeElement===nodes[0]){e.preventDefault();nodes.at(-1).focus()}else if(!e.shiftKey&&document.activeElement===nodes.at(-1)){e.preventDefault();nodes[0].focus()}}});
if(parent.getThemePreview?.()||parent.parent.getThemePreview?.())document.getElementById('places').classList.add('dark');
renderResults();
const profilePlace=new URLSearchParams(location.search).get('detail');
if(profilePlace==='victory'||profilePlace==='lake'){document.getElementById('places').classList.add('detail-only');const n=profilePlace==='lake'?3:2;favoritePlaces.add(n);placeDetails(n);}
</script><script src="shared-filters.js"></script><script src="review-state.js"></script><script src="workflow-driver.js"></script><script src="field-hints.js"></script><link rel="stylesheet" href="shared-overlays.css"><script src="shared-overlays.js"></script><link rel="stylesheet" href="shared-actions.css"><link rel="stylesheet" href="shared-forms.css"><script src="shared-forms.js"></script><link rel="stylesheet" href="shared-states.css"><script src="shared-states.js"></script><link rel="stylesheet" href="shared-navigation.css"><script src="shared-navigation.js"></script></html>
