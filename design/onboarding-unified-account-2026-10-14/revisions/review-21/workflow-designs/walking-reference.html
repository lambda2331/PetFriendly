<!doctype html><html lang="ru"><base href="../"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Preserved Walks · neutral account header</title><link rel="stylesheet" href="../../frozen/design/walks-studio-review/styles.css"><link rel="stylesheet" href="shared-refinements.css"><style>body{background:transparent}main{padding:0!important;margin:0}.review-grid{display:block}.review-grid>section:nth-child(2),.preview-label,#controls{display:none}.phone{height:850px;margin:0 auto;width:100%}.brand .mode{display:none}</style><main><div id="controls"></div><div id="grid" class="review-grid"></div></main><script src="../../frozen/design/walking-assets/lucide.min.js"></script><script src="../../frozen/design/walks-studio-review/app.js"></script><script src="navigation-refinement.js"></script><script>strings.currentAll=['Все','All','Усе','Wszystkie'];strings.currentMine=['Мои прогулки','My walks','Мае прагулкі','Moje spacery'];strings.currentRequests=['Мои запросы','My requests','Мае запыты','Moje prośby'];strings.currentNearby=['Запросы рядом','Nearby requests','Запыты побач','Prośby w pobliżu'];strings.currentShow=['Показать','Show','Паказаць','Pokaż'];strings.currentCount=['Результаты','Results','Вынікі','Wyniki'];strings.currentReset=['Сбросить фильтры','Reset filters','Скінуць фільтры','Wyczyść filtry'];strings.petHelpSearch=['Питомец, участник','Pet, participant','Гадаванец, удзельнік','Zwierzę, uczestnik'];
strings.recordAgreement=['Прогулка','Walk','Прагулка','Spacer'];strings.recordOwnRequest=['Мой запрос','My request','Мой запыт','Moja prośba'];strings.recordNearbyRequest=['Запрос рядом','Nearby request','Запыт побач','Prośba w pobliżu'];strings.currentFilters=['Фильтры','Filters','Фільтры','Filtry'];strings.currentDateTitle=['Дата','Date','Дата','Data'];strings.currentApply=['Применить','Apply','Ужыць','Zastosuj'];strings.currentResetShort=['Сбросить','Reset','Скінуць','Wyczyść'];
function currentTools(){const v=views[0];v.currentDate??='allDates';v.currentKind??='currentAll';const active=Number(v.currentDate!=='allDates')+Number(v.currentKind!=='currentAll');return `<div class="history-tools current-tools"><label class="search">${ic('search')}<input type="search" aria-label="${t('petHelpSearch')}" placeholder="${t('petHelpSearch')}" value="${esc(v.currentQuery||'')}" oninput="searchCurrent(this.value)"></label>${btn(ic('list-filter')+(active?`<span class="filter-badge" aria-hidden="true">${active}</span>`:''),'openCurrentFilters()',`class="icon-button filter current-filter-trigger ${active?'is-filtered':''}" aria-label="${t('currentFilters')}${active?`: ${active}`:''}" aria-haspopup="dialog"`)}</div>`;}
function openCurrentFilters(){const v=views[0];v.currentFilterDraft={kind:v.currentKind,date:v.currentDate};openSheet(0,'currentFilters');}
function closeCurrentFilters(){views[0].currentFilterDraft=null;closeSheet(0);document.querySelector('.current-filter-trigger')?.focus();}
function resetCurrentFilterDraft(){views[0].currentFilterDraft={kind:'currentAll',date:'allDates'};document.querySelectorAll('.current-filter-sheet input').forEach(input=>input.checked=input.value===(input.name==='kind'?'currentAll':'allDates'));}
function applyCurrentFilters(event){event.preventDefault();const v=views[0];v.currentKind=v.currentFilterDraft.kind;v.currentDate=v.currentFilterDraft.date;closeCurrentFilters();}
const originalCurrentSheet=sheet;
sheet=function(i){if(views[i].sheet!=='currentFilters')return originalCurrentSheet(i);const draft=views[i].currentFilterDraft;const group=(name,title,values)=>`<fieldset><legend>${t(title)}</legend>${values.map(value=>`<label class="current-filter-option"><input type="radio" name="${name}" value="${value}" ${draft[name]===value?'checked':''} onchange="views[0].currentFilterDraft.${name}=this.value"><span>${t(value)}</span></label>`).join('')}</fieldset>`;return `<div class="shade" onclick="if(event.target===this)closeCurrentFilters()"><section class="sheet current-filter-sheet" role="dialog" aria-modal="true" aria-labelledby="current-filter-title"><header class="sheet-head"><h2 id="current-filter-title">${t('currentFilters')}</h2>${btn(ic('x'),'closeCurrentFilters()',`class="icon-button" aria-label="${t('close')}"`)}</header><form onsubmit="applyCurrentFilters(event)"><div class="sheet-body">${group('kind','currentShow',['currentAll','currentMine','currentRequests','currentNearby'])}${group('date','currentDateTitle',['allDates','month','lastMonth'])}</div><footer class="current-filter-actions">${btn(t('currentResetShort'),'resetCurrentFilterDraft()','class="filter-reset" type="button"')}${btn(t('currentApply'),'','class="primary" type="submit"')}</footer></form></section></div>`;};
document.addEventListener('keydown',event=>{if(views[0].sheet!=='currentFilters')return;if(event.key==='Escape'){event.preventDefault();event.stopImmediatePropagation();closeCurrentFilters();}else if(event.key==='Tab'){const controls=[...document.querySelectorAll('.current-filter-sheet button,.current-filter-sheet input:checked')];const first=controls[0],last=controls[controls.length-1];if(event.shiftKey&&document.activeElement===first){event.preventDefault();last.focus()}else if(!event.shiftKey&&document.activeElement===last){event.preventDefault();first.focus()}}},true);
function searchCurrent(value){views[0].currentQuery=value;filterCurrentRows();}
function filterCurrentRows(){const content=document.querySelector('#phone-0 .content');if(!content||views[0].tab!=='current'||scenario!=='list')return;const v=views[0],q=(v.currentQuery||'').trim().toLocaleLowerCase(locale),rows=[...content.querySelectorAll(':scope>.walk')],kind={currentMine:'agreement',currentRequests:'request',currentNearby:'nearby'}[v.currentKind];rows.forEach(row=>{const label=row.querySelector('.walk-kind');if(label)label.hidden=!!kind;row.hidden=v.currentDate==='lastMonth'||!!kind&&row.dataset.currentKind!==kind||!row.textContent.toLocaleLowerCase(locale).includes(q)});const count=rows.filter(row=>!row.hidden).length;let empty=content.querySelector('.current-empty');if(rows.length&&!count){if(!empty){empty=document.createElement('div');empty.className='state-center current-empty';empty.setAttribute('role','status');empty.innerHTML=ic('search')+`<h3>${t('noHistoryMatches')}</h3><p>${t('trySearch')}</p>`+btn(t('currentReset'),"clearCurrent()",'class="outline"');content.append(empty);lucide.createIcons()}}else empty?.remove();parent.setCurrentListPreview?.({currentQuery:v.currentQuery,currentDate:v.currentDate,currentKind:v.currentKind});}
function nearbyCurrentCard(){return `<article class="walk nearby-request" data-current-kind="nearby"><span class="record-type">${t('recordNearbyRequest')}</span><div class="identity"><span class="avatar">${ic('dog')}</span><span class="identity-copy"><strong class="name">Боня</strong><span class="facts">14 октября · 18:00 · 45 мин</span><span class="facts">Минск · Центральный район</span><span class="facts">Владелец · Михаил</span></span></div><div class="walk-meta"><span class="status-chip">Ищет помощника</span></div><div class="action-pair">${btn(t('details'),"parent.showHelpingRequests()",'class="outline"')}${btn(t('apply'),"parent.parent.openHelperSetup('request')",'class="primary"')}</div></article>`;}
function clearCurrent(){views[0].currentQuery='';views[0].currentDate='allDates';views[0].currentKind='currentAll';views[0].menu=null;render();}
const restoredCurrentList=parent.getCurrentListPreview?.();if(restoredCurrentList)Object.assign(views[0],restoredCurrentList);const originalWalkingRender=render;render=function(){originalWalkingRender();refineNavigation();const content=document.querySelector('#phone-0 .content');if(content&&views[0].screen==='hub'&&views[0].tab==='current'){content.querySelector(':scope>.section-heading')?.remove();content.querySelector('.tabs').insertAdjacentHTML('afterend',currentTools());if(scenario==='list'){const rows=[...content.querySelectorAll(':scope>.walk')];rows.forEach((row,n)=>{row.dataset.currentKind=n===0?'agreement':'request';row.insertAdjacentHTML('afterbegin',`<span class="record-type">${t(n===0?'recordAgreement':'recordOwnRequest')}</span>`)});content.insertAdjacentHTML('beforeend',nearbyCurrentCard());filterCurrentRows()}lucide.createIcons();if(views[0].sheet==='currentFilters'){const phone=document.getElementById('phone-0');[...phone.children].filter(node=>!node.classList.contains('shade')).forEach(node=>node.inert=true)}}};const q=new URLSearchParams(location.search);dark=q.get('theme')==='dark';large=q.get('large')==='true';scenario=q.get('state')||'list';render();</script><script>const requestPet=parent.parent.consumePetRequestPreview?.();if(requestPet){const priorRequestSheet=sheet;sheet=function(i){const html=priorRequestSheet(i);return views[i].sheet==='create'?html.replace('value="Персик"','value="'+esc(requestPet.name)+'"').replace('Гуляет на шлейке.',esc(requestPet.care||'')):html;};openSheet(0,'create');}</script><script>
strings.recordAgreement=['Прогулка','Walk','Прагулка','Spacer'];strings.recordOwnRequest=['Мой запрос','My request','Мой запыт','Moja prośba'];strings.recordNearbyRequest=['Запрос рядом','Nearby request','Запыт побач','Prośba w pobliżu'];strings.agreementUpcoming=['Запланирована','Scheduled','Запланаваная','Zaplanowany'];strings.agreementCompleted=['Завершена','Completed','Завершаная','Zakończony'];
const review21Sheet=sheet;sheet=function(i){let html=review21Sheet(i);if(views[i].sheet==='details'){const key=views[i].detailsKind==='history'?'agreementCompleted':'agreementUpcoming';html=html.replace('<h3>Персик</h3>','<h3>Персик</h3><p class="agreement-state">'+t(key)+'</p>');}return html;};render();
</script><script src="workflow-driver.js"></script></html>
