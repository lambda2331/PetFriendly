<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Preserved Walks · neutral account header</title><link rel="stylesheet" href="../../frozen/design/walks-studio-review/styles.css"><link rel="stylesheet" href="shared-refinements.css"><style>body{background:transparent}main{padding:0!important;margin:0}.review-grid{display:block}.review-grid>section:nth-child(2),.preview-label,#controls{display:none}.phone{height:850px;margin:0 auto;width:100%}.brand .mode{display:none}</style><main><div id="controls"></div><div id="grid" class="review-grid"></div></main><script src="../../frozen/design/walking-assets/lucide.min.js"></script><script src="../../frozen/design/walks-studio-review/app.js"></script><script src="navigation-refinement.js"></script><script>strings.currentReset=['Сбросить фильтры','Reset filters','Скінуць фільтры','Wyczyść filtry'];strings.petHelpSearch=['Питомец, участник','Pet, participant','Гадаванец, удзельнік','Zwierzę, uczestnik'];
function currentTools(){const v=views[0];v.currentDate??='allDates';return `<div class="history-tools current-tools"><label class="search">${ic('search')}<input type="search" aria-label="${t('petHelpSearch')}" placeholder="${t('petHelpSearch')}" value="${esc(v.currentQuery||'')}" oninput="searchCurrent(this.value)"></label><div class="top-menu">${btn(ic('list-filter'),`toggleMenu(0,'currentDate')`,`class="icon-button filter ${v.currentDate!=='allDates'?'is-filtered':''}" aria-label="${t('filter')}: ${t(v.currentDate)}" aria-expanded="${v.menu==='currentDate'}"`)}${v.menu==='currentDate'?menu(0,'currentDate',['allDates','month','lastMonth']):''}</div></div>`;}
function searchCurrent(value){views[0].currentQuery=value;filterCurrentRows();}
function filterCurrentRows(){const content=document.querySelector('#phone-0 .content');if(!content||views[0].tab!=='current'||scenario!=='list')return;const q=(views[0].currentQuery||'').trim().toLocaleLowerCase(locale),rows=[...content.querySelectorAll(':scope>.walk')];rows.forEach(row=>{row.hidden=views[0].currentDate==='lastMonth'||!row.textContent.toLocaleLowerCase(locale).includes(q)});const section=content.querySelector(':scope>.section-heading');if(section)section.hidden=rows.slice(1).every(row=>row.hidden);let empty=content.querySelector('.current-empty');if(rows.length&&rows.every(row=>row.hidden)){if(!empty){empty=document.createElement('div');empty.className='state-center current-empty';empty.setAttribute('role','status');empty.innerHTML=ic('search')+`<h3>${t('noHistoryMatches')}</h3><p>${t('trySearch')}</p>`+btn(t('currentReset'),"clearCurrent()",'class="outline"');content.querySelector('.request-discovery')?.before(empty);lucide.createIcons()}}else empty?.remove();}
function clearCurrent(){views[0].currentQuery='';views[0].currentDate='allDates';views[0].menu=null;render();}
const originalWalkingRender=render;render=function(){originalWalkingRender();refineNavigation();const content=document.querySelector('#phone-0 .content');if(content&&views[0].screen==='hub'&&views[0].tab==='current'){const row=document.createElement('button');row.className='request-discovery';row.innerHTML='<span class="copy"><strong>Запросы рядом</strong><span>Найти прогулку, на которой вы можете помочь</span></span><i data-lucide="chevron-right" class="icon"></i>';row.onclick=()=>parent.showHelpingRequests();content.append(row);content.querySelector('.tabs').insertAdjacentHTML('afterend',currentTools());filterCurrentRows();lucide.createIcons()}};const q=new URLSearchParams(location.search);dark=q.get('theme')==='dark';large=q.get('large')==='true';scenario=q.get('state')||'list';render();</script><script>const requestPet=parent.parent.consumePetRequestPreview?.();if(requestPet){const priorRequestSheet=sheet;sheet=function(i){const html=priorRequestSheet(i);return views[i].sheet==='create'?html.replace('value="Персик"','value="'+esc(requestPet.name)+'"').replace('Гуляет на шлейке.',esc(requestPet.care||'')):html;};openSheet(0,'create');}</script></html>
