<!doctype html><html lang="ru"><base href="../"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Nearby · typography and action refinement</title><link rel="stylesheet" href="frozen/design/shell-settings-studio-review/styles.css"><link rel="stylesheet" href="shared-refinements.css"><style>body,main{margin:0;padding:0!important;background:transparent}.phone{height:850px;width:100%;border:0;border-radius:0}.intro-title{font:800 30px/1.2 Manrope;letter-spacing:-.03em;margin:12px 0}.intro-support{font-size:14px;color:var(--muted);margin:0 0 24px;line-height:1.5}.meeting-preview{display:block;padding:16px;background:var(--soft);border-radius:16px;margin-bottom:28px;width:100%;text-align:left}.meeting-preview strong{font:700 18px Manrope}.meeting-preview .meta{font-size:13px;line-height:1.5}.meeting-preview .link{display:flex;justify-content:space-between;align-items:center;font-size:14px;font-weight:600;margin-top:16px}.place-heading{font:700 22px Manrope;margin:0 0 12px}.map-tools{display:flex;align-items:center;gap:8px;margin-bottom:12px}.city-control{display:flex;gap:8px;align-items:center;flex:1;text-align:left;border:1px solid var(--line);border-radius:12px;padding:12px}.city-control strong{flex:1;font-weight:600}.list-control{display:flex;align-items:center;gap:8px;min-height:48px;padding:12px;background:var(--lime);color:var(--onlime);border-radius:12px;font-size:14px;font-weight:600}.map-preview{position:relative;min-height:240px;background:var(--soft);border-radius:20px;display:flex;align-items:center;justify-content:center;padding:64px 20px 24px;text-align:center}.expand-map{position:absolute;right:12px;top:12px;background:var(--bg);border-radius:12px}.map-preview p{font-size:14px;color:var(--muted);line-height:1.5;margin:8px 0}.unavailable-title{font:600 16px Golos}.brand .mode{display:none}.brand .header-actions{margin-left:auto}.shade .sheet-body .row{padding:16px 12px}.map-full{position:absolute;inset:0;z-index:12;background:var(--bg);display:flex;flex-direction:column}.map-full .map-preview{flex:1;margin:20px}.phone.large{font-size:24px}.phone.large .intro-title{font-size:40px}.phone.large .intro-support,.phone.large .meta,.phone.large .list-control{font-size:22px}.phone.large .map-tools{flex-wrap:wrap}.phone.large .city-control{flex-basis:100%}.map-preview{height:240px}.map-preview svg.icon{width:24px;height:24px}.map-full .map-preview{height:auto}</style><link rel="stylesheet" href="mock-system.css"><main><div class="phone" id="phone"><div class="status"><strong>9:41</strong><span>LTE</span></div><header class="brand"><span class="wordmark">petfriendly<span>.</span></span><span class="header-actions"><button class="icon-button bell" aria-label="События" onclick="parent.openModal(0,'activity')"><i data-lucide="bell" class="icon"></i><span class="bell-dot"></span></button><button class="icon-button" aria-label="Переключить тему" onclick="parent.toggleTheme()"><i data-lucide="moon" class="icon"></i></button><button class="icon-button" aria-label="Настройки" onclick="parent.openModal(0,'settings')"><i data-lucide="settings-2" class="icon"></i></button></span></header><div class="scroll-content"><h2 class="intro-title">Хороший день для прогулки.</h2><p class="intro-support">И новой компании для вас двоих.</p><div class="meeting-preview"><button type="button" class="meeting-featured" onclick="location.href='meetings-reference.html?state=detail&event=park'"><strong>Прогулка в парке</strong><span class="meta">18 октября · 11:00 · Парк Победы</span></button><button type="button" class="nearby-meetings-link" onclick="location.href='meetings-reference.html?state=list'">Все встречи<i data-lucide="arrow-right" class="icon"></i></button></div><h3 class="place-heading">Места рядом</h3><div class="map-tools"><button class="city-control" aria-label="Выбрать город" onclick="showCity()"><i data-lucide="map-pin" class="icon"></i><strong id="city-name">Минск</strong><i data-lucide="chevron-down" class="icon"></i></button><button class="list-control" onclick="showPlaces()"><i data-lucide="list" class="icon"></i>Список мест</button></div><div class="map-preview"><button class="icon-button expand-map" aria-label="Открыть карту на весь экран" onclick="showFullMap()"><i data-lucide="maximize-2" class="icon"></i></button><div><i data-lucide="map" class="icon"></i><strong class="unavailable-title" style="display:block;margin-top:12px">Карта пока недоступна</strong><p>Места можно посмотреть списком.</p></div></div></div><div class="nav-wrap"><nav class="nav" aria-label="Основная навигация"><button aria-current="page" onclick="parent.go(0,'nearby')"><i data-lucide="compass" class="icon"></i>Рядом</button><button onclick="parent.go(0,'people')"><i data-lucide="users-round" class="icon"></i>Люди</button><button onclick="parent.go(0,'walks')"><i data-lucide="paw-print" class="icon"></i>Выгул</button><button onclick="parent.go(0,'chats')"><i data-lucide="message-circle" class="icon"></i>Чаты</button><button onclick="parent.go(0,'profile')"><i data-lucide="user-round" class="icon"></i>Я</button></nav><div class="home-indicator"></div></div><div id="overlay"></div></div></main><script src="frozen/design/walking-assets/lucide.min.js"></script><script>
function showPlaces(){document.getElementById('overlay').innerHTML='<section class="map-full" role="dialog" aria-modal="true" aria-label="Список мест"><iframe title="Предыдущий экран списка мест" src="places-reference.html" style="width:100%;height:100%;border:0"></iframe></section>';icons();}

let previousFocus=null;
function icons(){const overlay=document.getElementById('overlay'),active=!!overlay.children.length;document.querySelectorAll('#phone>.status,#phone>.brand,#phone>.scroll-content,#phone>.nav-wrap').forEach(el=>el.inert=active);lucide.createIcons();if(active){previousFocus=document.activeElement;overlay.querySelector('button')?.focus();}}
function dismiss(){document.getElementById('overlay').innerHTML='';icons();previousFocus?.focus();}
document.addEventListener('keydown',e=>{const overlay=document.getElementById('overlay');if(!overlay.children.length)return;if(e.key==='Escape')dismiss();if(e.key==='Tab'){const buttons=[...overlay.querySelectorAll('button')],first=buttons[0],last=buttons.at(-1);if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}}});
function showCity(){document.getElementById('overlay').innerHTML='<div class="shade"><section class="sheet" role="dialog" aria-modal="true" aria-label="Выберите город"><header class="sheet-head"><h2>Выберите город</h2><button class="icon-button" aria-label="Закрыть" onclick="dismiss()"><i data-lucide="x" class="icon"></i></button></header><div class="sheet-body"><button class="row" onclick="chooseCity(0)">Минск · Беларусь</button><button class="row" onclick="chooseCity(1)">Warszawa · Polska</button></div></section></div>';icons()}
function chooseCity(n){document.getElementById('city-name').textContent=n?'Warszawa':'Минск';dismiss()}
function showFullMap(){document.getElementById('overlay').innerHTML='<section class="map-full" role="dialog" aria-modal="true" aria-label="Карта"><header class="full-head"><button class="icon-button" aria-label="Назад" onclick="dismiss()"><i data-lucide="arrow-left" class="icon"></i></button><h2>Карта</h2></header><div class="map-preview"><div><strong>Карта пока недоступна</strong><p>Попробуйте позже или откройте список мест.</p><button class="outline" onclick="showPlaces()">Список мест</button></div></div></section>';icons()}
document.getElementById('phone').classList.toggle('dark',parent.getThemePreview());if(parent.getThemePreview())document.querySelector('[data-lucide=moon]').setAttribute('data-lucide','sun');icons();
</script><script src="nearby-city-picker.js"></script><script src="navigation-refinement.js"></script><script>refineNavigation();</script>

<script>function closeSheetForMap(name){dismiss();showFullMap();if(name)document.querySelector('.map-full h2').textContent=name;}</script>

<script>const requestedMapPlace=new URLSearchParams(location.search).get("mapPlace");if(requestedMapPlace)closeSheetForMap(requestedMapPlace);</script><script src="workflow-driver.js"></script><script src="field-hints.js"></script><link rel="stylesheet" href="shared-overlays.css"><script src="shared-overlays.js"></script></html>
