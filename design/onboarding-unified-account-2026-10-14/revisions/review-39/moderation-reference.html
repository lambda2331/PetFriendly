<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="../../frozen/design/shell-settings-studio-review/styles.css"><link rel="stylesheet" href="shared-refinements.css"><style>body{margin:0;background:transparent}.full-body{padding:20px}.field select{width:100%;padding:12px;background:var(--soft);border:1px solid var(--line);border-radius:12px}.phone{height:auto;border:0;border-radius:0;width:100%}</style><link rel="stylesheet" href="mock-system.css"><div class="phone"><div class="full-body" id="reviewer"></div></div><script src="mock-state.js"></script><script src="mock-labels.js"></script><script src="mock-ui.js"></script><script>
let reviewerFactor=false;function moderationRender(){const root=document.getElementById('reviewer'),a=PFMock.account();root.innerHTML=!reviewerFactor?'<h3>MFA модератора · макет</h3><p>Независимая тестовая роль. Для просмотра очереди требуется код 000000. Полномочия не назначаются пользовательскому аккаунту.</p><label class="field">Код<input id="factor" maxlength="6" inputmode="numeric"></label><button class="primary" onclick="verifyModerator()">Проверить</button>':`<p>Очередь · локальный сеанс. Реального решения на сервере нет.</p>${a.proposals.map(p=>`<div class="detail-block"><strong data-user-content>${PFUI.esc(p.name)}</strong><p>${PFUI.esc(p.status)} · доступ с питомцем неизвестен</p>${p.status==='pending'?`<button class="outline" onclick="decideProposal('${p.id}','approved')">Одобрить · макет</button><button class="outline" onclick="decideProposal('${p.id}','rejected')">Отклонить · макет</button>`:''}</div>`).join('')||'<p>Нет предложений</p>'}${a.security.reports.map((r,n)=>`<div class="detail-block"><strong data-user-content>${PFUI.esc(r.kind)}</strong><p data-user-content>${PFUI.esc(r.reason)}</p><p>${PFUI.esc(r.status)}</p><button class="outline" onclick="PFMock.account().security.reports[${n}].status='reviewed';moderationRender()">Отметить проверенной · макет</button></div>`).join('')}`;PFUI.translate()};function verifyModerator(){if(document.getElementById('factor').value!=='000000'){document.getElementById('factor').setCustomValidity('Код неверен · макет');document.getElementById('factor').reportValidity();return}reviewerFactor=true;moderationRender()}function decideProposal(id,status){if(!reviewerFactor)return;const p=PFMock.account().proposals.find(p=>p.id===id);if(p&&p.status==='pending'){p.status=status;if(status==='approved'){const a=PFMock.account();(a.publicPlaces??=[]).push({id:p.id,name:p.name,category:p.category,city:p.city,point:p.point,kind:p.category==='park'?'Парк':p.category==='dog'?'Площадка':p.category==='pet'?'Зоомагазин':p.category==='vet'?'Ветеринарная клиника':'Кафе',access:'unknown',rating:null,icon:p.category==='park'?'trees':'map-pin'});}}moderationRender()}moderationRender();
</script><script src="field-hints.js"></script><link rel="stylesheet" href="shared-overlays.css"><script src="shared-overlays.js"></script><link rel="stylesheet" href="shared-actions.css"><link rel="stylesheet" href="shared-forms.css"><script src="shared-forms.js"></script></html>
