<!doctype html><html lang="ru"><base href="../"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Approved People reference</title><link rel="stylesheet" href="../../references/people-community-studio/styles.css"><link rel="stylesheet" href="shared-refinements.css"><style>body{background:transparent}main{padding:0!important;margin:0}.review-grid{display:block}.review-grid>section:not(:first-child),.preview-label,#review-controls{display:none}.phone{margin:0 auto;width:100%;height:850px}.headline{min-height:0;margin-bottom:8px}.tabs{margin-top:0!important}</style><main><div id="review-controls"></div><div id="previews" class="review-grid"></div></main><script src="../../references/people-community-studio/app.js"></script><script>const previousPeopleRender=render;render=function(){previousPeopleRender();refineNavigation()};document.addEventListener('click',e=>{const b=e.target.closest('.nav button');if(!b)return;const pages=['nearby','people','walks','chats','profile'];const idx=[...b.parentElement.children].indexOf(b);e.preventDefault();e.stopImmediatePropagation();parent.go(0,pages[idx]);},true);</script><script src="navigation-refinement.js"></script><script>refineNavigation();</script><script>
const review22PeopleSheet=sheet;sheet=function(i,v){let html=review22PeopleSheet(i,v);if(v.sheet?.kind==='create'){const photo=v.createDraft.photo;html=html.replace(/(<form[^>]*>)/,`$1<div class="community-photo-control"><button type="button" class="community-photo-pick" aria-label="Добавить фото сообщества" onclick="document.getElementById('community-image-${i}').click()">${photo?`<img src="${photo}" alt="">`:icon('photo')}</button><div class="community-photo-copy"><strong>Фото сообщества</strong><span class="meta">Необязательно</span>${photo?`<button type="button" class="community-photo-remove" onclick="views[${i}].createDraft.photo=null;render()">Убрать фото</button>`:''}</div><input id="community-image-${i}" type="file" hidden accept="image/jpeg,image/png,image/webp" onchange="communityImage(event,${i})"></div>${v.createPhotoError?`<p role="alert">${esc(v.createPhotoError)}</p>`:''}`);}return html;};
async function communityImage(event,i){const file=event.target.files?.[0],draft=views[i].createDraft;if(!file)return;if(!['image/jpeg','image/png','image/webp'].includes(file.type)||file.size>5*1024*1024){views[i].createPhotoError='Выберите фото JPEG, PNG или WebP до 5 МБ.';render();return;}try{const bitmap=await createImageBitmap(file),scale=Math.min(1,1200/Math.max(bitmap.width,bitmap.height)),canvas=document.createElement('canvas');canvas.width=Math.round(bitmap.width*scale);canvas.height=Math.round(bitmap.height*scale);canvas.getContext('2d').drawImage(bitmap,0,0,canvas.width,canvas.height);bitmap.close();if(views[i].createDraft!==draft)return;draft.photo=canvas.toDataURL('image/jpeg',.85);views[i].createPhotoError='';render();}catch(error){views[i].createPhotoError='Фото не открылось. Выберите другое.';render();}}
const review22CreateGroup=createGroup;createGroup=function(i){const photo=views[i].createDraft.photo,before=groups.length;review22CreateGroup(i);if(groups.length>before&&photo){groups[0].photo=photo;render();}};render();
</script><script src="workflow-driver.js"></script></html>
