<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Preserved Walks · neutral account header</title><link rel="stylesheet" href="../../frozen/design/walks-studio-review/styles.css"><link rel="stylesheet" href="shared-refinements.css"><style>body{background:transparent}main{padding:0!important;margin:0}.review-grid{display:block}.review-grid>section:nth-child(2),.preview-label,#controls{display:none}.phone{height:850px;margin:0 auto;width:100%}.brand .mode{display:none}</style><main><div id="controls"></div><div id="grid" class="review-grid"></div></main><script src="../../frozen/design/walking-assets/lucide.min.js"></script><script src="../../frozen/design/walks-studio-review/app.js"></script><script src="navigation-refinement.js"></script><script>strings.currentAll=['Все','All','Усе','Wszystkie'];strings.currentMine=['Мои прогулки','My walks','Мае прагулкі','Moje spacery'];strings.currentRequests=['Мои запросы','My requests','Мае запыты','Moje prośby'];strings.currentNearby=['Запросы рядом','Nearby requests','Запыты побач','Prośby w pobliżu'];strings.currentShow=['Показать','Show','Паказаць','Pokaż'];strings.currentCount=['Результаты','Results','Вынікі','Wyniki'];strings.currentReset=['Сбросить фильтры','Reset filters','Скінуць фільтры','Wyczyść filtry'];strings.petHelpSearch=['Питомец, участник','Pet, participant','Гадаванец, удзельнік','Zwierzę, uczestnik'];
function currentTools(){const v=views[0];v.currentDate??='allDates';return `<div class="history-tools current-tools"><label class="search">${ic('search')}<input type="search" aria-label="${t('petHelpSearch')}" placeholder="${t('petHelpSearch')}" value="${esc(v.currentQuery||'')}" oninput="searchCurrent(this.value)"></label><div class="top-menu">${btn(ic('list-filter'),`toggleMenu(0,'currentDate')`,`class="icon-button filter ${v.currentDate!=='allDates'?'is-filtered':''}" aria-label="${t('filter')}: ${t(v.currentDate)}" aria-expanded="${v.menu==='currentDate'}"`)}${v.menu==='currentDate'?menu(0,'currentDate',['allDates','month','lastMonth']):''}</div></div>`;}
function searchCurrent(value){views[0].currentQuery=value;filterCurrentRows();}
function filterCurrentRows(){const content=document.querySelector('#phone-0 .content');if(!content||views[0].tab!=='current'||scenario!=='list')return;const v=views[0],q=(v.currentQuery||'').trim().toLocaleLowerCase(locale),rows=[...content.querySelectorAll(':scope>.walk')],kind={currentMine:'agreement',currentRequests:'request',currentNearby:'nearby'}[v.currentKind];rows.forEach(row=>{const label=row.querySelector('.walk-kind');if(label)label.hidden=!!kind;row.hidden=v.currentDate==='lastMonth'||!!kind&&row.dataset.currentKind!==kind||!row.textContent.toLocaleLowerCase(locale).includes(q)});const count=rows.filter(row=>!row.hidden).length;const countNode=content.querySelector('.current-count');if(countNode)countNode.textContent=count;let empty=content.querySelector('.current-empty');if(rows.length&&!count){if(!empty){empty=document.createElement('div');empty.className='state-center current-empty';empty.setAttribute('role','status');empty.innerHTML=ic('search')+`<h3>${t('noHistoryMatches')}</h3><p>${t('trySearch')}</p>`+btn(t('currentReset'),"clearCurrent()",'class="outline"');content.append(empty);lucide.createIcons()}}else empty?.remove();parent.setCurrentListPreview?.({currentQuery:v.currentQuery,currentDate:v.currentDate,currentKind:v.currentKind});}
function currentKindTools(){const v=views[0];v.currentKind??='currentAll';return `<div class="current-kind-tools"><div class="top-menu">${btn(`<span>${t(v.currentKind)}</span>${ic('chevron-down')}`,`toggleMenu(0,'currentKind')`,`class="current-kind-select" aria-label="${t('currentShow')}: ${t(v.currentKind)}" aria-haspopup="menu" aria-expanded="${v.menu==='currentKind'}"`)}${v.menu==='currentKind'?menu(0,'currentKind',['currentAll','currentMine','currentRequests','currentNearby']):''}</div><span class="current-count" aria-label="${t('currentCount')}" aria-live="polite"></span></div>`;}
function nearbyCurrentCard(){return `<article class="walk nearby-request" data-current-kind="nearby"><p class="walk-kind">${t('currentNearby')}</p><div class="identity"><span class="avatar">${ic('dog')}</span><span class="identity-copy"><strong class="name">Боня</strong><span class="facts">14 октября · 18:00 · 45 мин</span><span class="facts">Минск · Центральный район</span><span class="facts">Владелец · Михаил</span></span></div><div class="walk-meta"><span class="status-chip">Ищет помощника</span></div><div class="action-pair">${btn(t('details'),"parent.showHelpingRequests()",'class="outline"')}${btn(t('apply'),"parent.parent.openHelperSetup('request')",'class="primary"')}</div></article>`;}
function clearCurrent(){views[0].currentQuery='';views[0].currentDate='allDates';views[0].currentKind='currentAll';views[0].menu=null;render();}
const restoredCurrentList=parent.getCurrentListPreview?.();if(restoredCurrentList)Object.assign(views[0],restoredCurrentList);const originalWalkingRender=render;render=function(){originalWalkingRender();refineNavigation();const content=document.querySelector('#phone-0 .content');if(content&&views[0].screen==='hub'&&views[0].tab==='current'){content.querySelector(':scope>.section-heading')?.remove();content.querySelector('.tabs').insertAdjacentHTML('afterend',currentTools()+currentKindTools());if(scenario==='list'){const rows=[...content.querySelectorAll(':scope>.walk')];rows.forEach((row,n)=>{row.dataset.currentKind=n===0?'agreement':'request';row.insertAdjacentHTML('afterbegin',`<p class="walk-kind">${t(n===0?'currentMine':'currentRequests')}</p>`)});content.insertAdjacentHTML('beforeend',nearbyCurrentCard());filterCurrentRows()}lucide.createIcons()}};const q=new URLSearchParams(location.search);dark=q.get('theme')==='dark';large=q.get('large')==='true';scenario=q.get('state')||'list';render();</script><script>const requestPet=parent.parent.consumePetRequestPreview?.();if(requestPet){const priorRequestSheet=sheet;sheet=function(i){const html=priorRequestSheet(i);return views[i].sheet==='create'?html.replace('value="Персик"','value="'+esc(requestPet.name)+'"').replace('Гуляет на шлейке.',esc(requestPet.care||'')):html;};openSheet(0,'create');}</script></html>
